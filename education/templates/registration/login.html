<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Plateforme CPGE</title>
    <style>
        /* Reset de base pour éviter les marges par défaut des navigateurs */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: #0b0c10; 
            color: #c5c6c7; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: flex-end; /* Aligne le panneau à droite */
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; /* Empêche l'apparition de barres de défilement */
        }

        /* Panneau de connexion */
        .login-sidebar { 
            background-color: #1f2833; 
            width: 100%; 
            max-width: 400px; 
            height: 100vh;
            padding: 50px 40px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5); 
        }
        
        h2 { 
            color: #66fcf1; 
            margin-bottom: 30px; 
            text-align: center;
            font-size: 2.2rem;
        }
        
        /* Structure du formulaire */
        form {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Espace identique entre chaque champ */
        }

        input { 
            width: 100%; 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid #45a29e; 
            background-color: #0b0c10; 
            color: #fff; 
            outline: none; 
            font-size: 1rem;
        }
        input:focus { 
            border-color: #66fcf1; 
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.3); 
        }
        
        .btn-login { 
            width: 100%; 
            padding: 15px; 
            background-color: #45a29e; 
            color: #0b0c10; 
            border: none; 
            border-radius: 8px; 
            font-size: 1.1rem; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-top: 10px;
        }
        .btn-login:hover { background-color: #66fcf1; }

        /* Correction du lien violet "Retour aux cours" */
        .link-retour { 
            text-align: center; 
            color: #45a29e; /* Force la couleur néon */
            text-decoration: none; 
            font-weight: bold; 
            font-size: 0.95rem; 
            margin-top: 20px; 
            transition: 0.3s; 
        }
        /* Appliqué même si le lien a déjà été visité */
        .link-retour:visited { color: #45a29e; }
        .link-retour:hover { 
            color: #66fcf1; 
            text-shadow: 0 0 8px rgba(102, 252, 241, 0.4); 
        }

        /* Section Inscription */
        .separation { 
            border-top: 1px solid #45a29e; 
            margin: 40px 0 20px 0; 
            opacity: 0.3; 
        }
        .texte-nouveau { 
            text-align: center; 
            font-size: 0.9rem; 
            color: #c5c6c7; 
            margin-bottom: 15px; 
        }
        
        /* Bouton fantôme pour l'inscription */
        .link-inscription { 
            display: block; 
            width: 100%; 
            padding: 12px; 
            text-align: center; 
            border: 2px solid #45a29e; 
            border-radius: 8px; 
            color: #66fcf1; 
            text-decoration: none; 
            font-weight: bold; 
            transition: all 0.3s ease; 
        }
        .link-inscription:visited { color: #66fcf1; }
        .link-inscription:hover { 
            background-color: #45a29e; 
            color: #0b0c10; 
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.4); 
        }
    </style>
</head>
<body>
    <!-- Le fond animé avec les symboles mathématiques reste géré par ton canvas Three.js s'il est inclus -->

    <div class="login-sidebar">
        <h2>Accès Élèves</h2>
        
        {% if form.errors %}
            <div style="color: #ff6b6b; text-align: center; margin-bottom: 15px;">Identifiant ou mot de passe incorrect.</div>
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Identifiant" required>
            <input type="password" name="password" placeholder="Mot de passe" required>
            <button type="submit" class="btn-login">Se connecter</button>
        </form>

        <a href="{% url 'liste_cours' %}" class="link-retour">← Retour aux cours</a>

        <div class="separation"></div>
        <p class="texte-nouveau">Nouveau sur la plateforme ?</p>
        <a href="{% url 'inscription' %}" class="link-inscription">Créer un compte gratuitement</a>
    </div>
</body>
</html>
